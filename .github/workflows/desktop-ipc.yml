name: Desktop IPC boundary

on:
  push:
    branches: [main]
    paths:
      - 'src/aik_ipc/**'
      - 'tests/test_desktop_ipc*.cjs'
      - 'planning/backlog.sqlite3'
      - '.github/workflows/desktop-ipc.yml'
  pull_request:
    paths:
      - 'src/aik_ipc/**'
      - 'tests/test_desktop_ipc*.cjs'
      - 'planning/backlog.sqlite3'
      - '.github/workflows/desktop-ipc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-ipc:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Set up Python for canonical ledger validation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          architecture: x64
      - name: Verify IPC boundary and asynchronous lifecycle
        run: node --test tests/test_desktop_ipc.cjs tests/test_desktop_ipc_lifecycle.cjs tests/test_desktop_ipc_queries.cjs
      - name: Validate the canonical ledger
        run: python tools/backlog.py validate
      - name: Verify ledger regression tests
        run: python -m unittest discover -s tests -p "test_backlog*.py" -v
