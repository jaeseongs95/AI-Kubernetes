# Linux/Windows regression for every AIK Python module and its ledger consistency.
# A pass is development verification only; it is not provider, VM, AGS or Windows
# product qualification. JavaScript packages (aik_ipc) are covered by desktop-ipc.yml.
# Real upstream tests report NOT_RUN when the upstream is not installed.
name: AIK modules

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'planning/**'
      - '.github/workflows/aik-modules.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'planning/**'
      - '.github/workflows/aik-modules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aik-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Python pinned runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          architecture: x64
      - name: Ledger consistency
        run: python tools/backlog.py validate
      - name: Every module test (src/aik_* packages)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Every src package is imported by a test module
        shell: python
        run: |
          import pathlib, re, sys
          texts = [path.read_text(encoding="utf-8") for path in pathlib.Path("tests").glob("test_*.py")]
          packages = sorted(path.name for path in pathlib.Path("src").glob("aik_*") if path.is_dir() and any(path.glob("*.py")))
          missing = [name for name in packages
                     if not any(re.search(rf"^\s*(from|import) {name}\b", text, re.M) for text in texts)]
          if missing:
              sys.exit("packages without a test module import: " + ", ".join(missing))
          print("packages covered:", len(packages))

  upstream-conformance:
    # Installs the pinned VM (vibemarshal 32bb0f9) non-editable and runs the
    # real-surface conformance tests with skips turned into failures. Needs the
    # repository secret VM_UPSTREAM_TOKEN (read access to the private upstream);
    # without it the job reports NOT_RUN and does not claim conformance.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      VM_UPSTREAM_TOKEN: ${{ secrets.VM_UPSTREAM_TOKEN }}
    steps:
      - name: Allow long upstream paths on Windows
        if: env.VM_UPSTREAM_TOKEN != '' && runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Report NOT_RUN without upstream access
        if: env.VM_UPSTREAM_TOKEN == ''
        shell: bash
        run: echo "::warning title=Upstream conformance NOT_RUN::VM_UPSTREAM_TOKEN secret is not configured; real VM conformance was not executed."
      - name: Checkout the exact source revision
        if: env.VM_UPSTREAM_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Checkout pinned upstream VM
        if: env.VM_UPSTREAM_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jaeseongs95/vibemarshal
          ref: 32bb0f9dd9f024045d24487312b50f5b703573a3
          token: ${{ secrets.VM_UPSTREAM_TOKEN }}
          path: upstream-vm
          persist-credentials: false
          sparse-checkout: requirements.lock
          sparse-checkout-cone-mode: false
      - name: Python pinned runtime
        if: env.VM_UPSTREAM_TOKEN != ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          architecture: x64
      # pip clones the pinned commit itself, so direct_url.json records
      # vcs_info.commit_id (read by the pinned-commit test) with a token-free URL.
      # Credentials reach git only through this step's GIT_CONFIG_* rewrite.
      - name: Install pinned upstream non-editable
        if: env.VM_UPSTREAM_TOKEN != ''
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.VM_UPSTREAM_TOKEN }}@github.com/jaeseongs95/vibemarshal.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/jaeseongs95/vibemarshal
        run: |
          python -m pip install -r upstream-vm/requirements.lock
          python -m pip install --no-deps "flowmarshal-engine @ git+https://github.com/jaeseongs95/vibemarshal@32bb0f9dd9f024045d24487312b50f5b703573a3"
      - name: Real upstream conformance (skips are failures)
        if: env.VM_UPSTREAM_TOKEN != ''
        env:
          AIK_REQUIRE_UPSTREAM: '1'
        run: python -m unittest tests.test_vm_real_conformance -v
