# One-shot preparation on the explicitly selected task branch. Removed before merge.
# Creates immutable Git blobs only; never commits, merges or updates a branch.
name: AIK-004 ledger evidence preparation
on:
  push:
    branches: [work/aik004-ipc-lifecycle-20261013]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.8'
      - name: Read the canonical SQLite task and its prerequisites
        run: python evidence/desktop-ipc/2026-10-13-lifecycle/record_ledger.py
      - name: Verify existing and new IPC tests
        run: node --test tests/test_desktop_ipc.cjs tests/test_desktop_ipc_lifecycle.cjs
      - name: Validate ledger and regression suite
        run: |
          python tools/backlog.py validate
          python -m unittest discover -s tests -p "test_backlog*.py" -v
  prepare:
    needs: verify
    if: github.repository == 'jaeseongs95/AI-Kubernetes' && github.ref == 'refs/heads/work/aik004-ipc-lifecycle-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.8'
      - name: Record only AIK-004 evidence and verify all unrelated rows unchanged
        run: python evidence/desktop-ipc/2026-10-13-lifecycle/record_ledger.py --prepare
      - name: Publish verified immutable blobs for the explicit commit step
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'jaeseongs95/AI-Kubernetes'
          assert os.environ['GITHUB_REF'] == 'refs/heads/work/aik004-ipc-lifecycle-20261013'
          paths = ('planning/backlog.sqlite3','planning/backlog.sql','docs/development-backlog.ko.md',
                   'README.md','evidence/desktop-ipc/2026-10-13-lifecycle/ci-validation.json')
          for path in paths:
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              body = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/jaeseongs95/AI-Kubernetes/git/blobs', data=body, method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print('AIK004_GENERATED_BLOB '+json.dumps({'path':path,'sha':expected,
                    'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}))
          PY
