name: Secret output redaction

on:
  push:
    branches: [main]
    paths:
      - 'src/aik_security/**'
      - 'tests/test_security_redaction.py'
      - '.github/workflows/secret-redaction.yml'
  pull_request:
    paths:
      - 'src/aik_security/**'
      - 'tests/test_security_redaction.py'
      - '.github/workflows/secret-redaction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-redaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Pinned CPython runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          architecture: x64
      - name: Run synthetic canary and fail-closed output tests
        run: python -m unittest discover -s tests -p test_security_redaction.py -v
