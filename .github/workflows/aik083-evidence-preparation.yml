# Branch-only source/evidence preparation. Removed before PR merge.
# Publishes only verified immutable blobs; never commits or modifies a ref.
name: AIK-083 file snapshot evidence preparation
on:
  push:
    branches: [work/aik083-file-snapshots-20261013]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.8'
      - name: Read canonical task, reproduce old failures, verify patched checker
        run: python evidence/product-acceptance/2026-10-13-snapshots/record_evidence.py
      - name: Validate canonical ledger
        run: python tools/backlog.py validate
      - name: Verify original ledger regressions
        run: python -m unittest discover -s tests -p "test_backlog*.py" -v
  prepare:
    needs: verify
    if: github.repository == 'jaeseongs95/AI-Kubernetes' && github.ref == 'refs/heads/work/aik083-file-snapshots-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.8'
      - name: Generate tested checker and one-task canonical evidence
        run: python evidence/product-acceptance/2026-10-13-snapshots/record_evidence.py --prepare
      - name: Publish verified immutable blobs for explicit commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'jaeseongs95/AI-Kubernetes'
          assert os.environ['GITHUB_REF'] == 'refs/heads/work/aik083-file-snapshots-20261013'
          paths = ('tools/product_acceptance.py','planning/backlog.sqlite3','planning/backlog.sql',
                   'docs/development-backlog.ko.md','README.md',
                   'evidence/product-acceptance/2026-10-13-snapshots/ci-validation.json')
          for path in paths:
              raw = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              payload = json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/jaeseongs95/AI-Kubernetes/git/blobs', data=payload, method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print('AIK083_GENERATED_BLOB '+json.dumps({'path':path,'sha':expected,
                    'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}))
          PY
