[package]
name = "aik-tauri-comparison"
version = "0.1.0"
description = "Independent Windows GUI comparison using the unchanged AIK foundation Python sidecar"
edition = "2021"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.4.3"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.3", features = [] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

